<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Budget Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F3; --panel:#FFFFFF; --ink:#172235; --muted:#5B6778; --line:#D4DAE2; --track:#E2E7ED;
  --income:#1E7A5A; --cost:#A33B3B; --limit:#B07D0B; --invest:#2F5DA8;
  --c-food:#5E9C3F; --c-flat:#7A3B69; --c-loan:#A33B3B; --c-car:#3F7C8C; --c-misc:#8A8F99; --c-free:#C9D3DE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161F; --panel:#18212D; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3646; --track:#243040;
    --income:#4CC08F; --cost:#E07A7A; --limit:#E0B44C; --invest:#7FA6E8;
    --c-food:#8CC46A; --c-flat:#C78BB6; --c-loan:#E07A7A; --c-car:#6FB3C4; --c-misc:#A8AEB8; --c-free:#33414F;
  }
}
:root[data-theme="dark"]{
  --bg:#10161F; --panel:#18212D; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3646; --track:#243040;
  --income:#4CC08F; --cost:#E07A7A; --limit:#E0B44C; --invest:#7FA6E8;
  --c-food:#8CC46A; --c-flat:#C78BB6; --c-loan:#E07A7A; --c-car:#6FB3C4; --c-misc:#A8AEB8; --c-free:#33414F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
header.top .brand{font-weight:600;color:var(--muted);font-size:15px}
button.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
button.ghost:hover{color:var(--ink);border-color:var(--muted)}
:focus-visible{outline:2px solid var(--invest);outline-offset:2px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:end;padding:18px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:28px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;font-weight:800;letter-spacing:-0.02em;margin:0 0 14px}
.hero p.sub{margin:0;color:var(--muted);font-size:17px;max-width:46ch}
.hero p.sub strong{color:var(--ink)}
.hero .chart{width:100%}
.hero .chart svg{width:100%;height:auto;display:block}
.netrow{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.netrow div{min-width:120px}
.netrow .k{font-size:13px;color:var(--muted)}
.netrow .v{font-size:24px;font-weight:700}

/* panels */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 22px 10px}
.panel h2{font-size:20px;margin:0 0 4px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 .tot{font-size:20px}
.panel .hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.panel.cost{border-top:4px solid var(--cost)}
.panel.inc{border-top:4px solid var(--income)}

.sl{padding:12px 0;border-top:1px solid var(--line)}
.sl .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sl label{font-weight:600;display:flex;align-items:center;gap:8px}
.sl label .dot{width:10px;height:10px;border-radius:2px;flex:none}
.sl .num{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.sl input[type=number]{width:96px;text-align:right;font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.sl input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(to right,var(--fill,var(--ink)) 0 var(--p,50%),var(--track) var(--p,50%) 100%);cursor:pointer}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--panel);border:3px solid var(--fill,var(--ink))}
.sl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--fill,var(--ink))}
.sl small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts select{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}

/* results */
.balance .big{font-size:40px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.balance .big.neg{color:var(--cost)}
.balance .big.pos{color:var(--income)}
.alloc{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:16px 0 10px;background:var(--track)}
.alloc span{display:block;height:100%;transition:width .25s ease}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:14px;margin-bottom:12px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend .pct{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px;padding:12px 0;border-top:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}
.warn{background:color-mix(in srgb,var(--cost) 12%,transparent);color:var(--ink);border-left:3px solid var(--cost);padding:8px 12px;border-radius:4px;font-size:14px;margin:8px 0 12px}

.proj svg{width:100%;height:auto;display:block}
.projnums{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0 14px}
.projnums .k{font-size:13px;color:var(--muted)}
.projnums .v{font-size:22px;font-weight:700}

details{margin-top:20px}
details summary{cursor:pointer;font-weight:700;font-size:17px;padding:8px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
tr.cross td{background:color-mix(in srgb,var(--limit) 16%,transparent)}
.foot{color:var(--muted);font-size:13px;margin-top:22px;max-width:80ch}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.alloc span{transition:none}}
.profile{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:10px 0 6px}
.profile .f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.profile select,.profile input{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:120px}
.profile input[type=number]{width:90px;min-width:0}
.profile .cityinfo{flex:1 1 260px;font-size:14px;color:var(--muted);line-height:1.45}
.profile .cityinfo strong{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{font:inherit;font-size:13px;background:none;border:0;padding:3px 10px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.hidden{display:none!important}
:root{--a1:#2F5DA8;--a2:#1E7A5A;--a3:#7A3B69;--a4:#3F7C8C;--a5:#9A6A12;--a6:#5E9C3F;--bankc:#8A8F99;--d1:#A33B3B;--d2:#C2655B;--d3:#7E2E2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--a1:#7FA6E8;--a2:#4CC08F;--a3:#C78BB6;--a4:#6FB3C4;--a5:#E0B44C;--a6:#8CC46A;--bankc:#A8AEB8;--d1:#E07A7A;--d2:#F0A090;--d3:#C05050}}
:root[data-theme="dark"]{--a1:#7FA6E8;--a2:#4CC08F;--a3:#C78BB6;--a4:#6FB3C4;--a5:#E0B44C;--a6:#8CC46A;--bankc:#A8AEB8;--d1:#E07A7A;--d2:#F0A090;--d3:#C05050}
.worth{margin-bottom:20px;border-top:4px solid var(--ink)}
.worth .chart svg{width:100%;height:auto;display:block}
.items{width:100%;min-width:620px;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.items th{text-align:left;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
.items td{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.items input{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:100%}
.items input[type=number]{text-align:right;min-width:90px}
.items td.kind{white-space:nowrap;font-weight:600}
.items td.kind i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.items tr.group td{background:var(--bg);font-weight:700;color:var(--muted);font-size:13px;padding:6px}
.items .na{color:var(--muted);text-align:right;padding-right:12px}
.items button.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:4px}
.items button.x:hover{color:var(--cost)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.worthgrid{display:grid;grid-template-columns:1fr minmax(220px,280px);gap:24px;align-items:start}
.worthstats{display:grid;gap:12px}
.worthstats .k{font-size:13px;color:var(--muted)}
.worthstats .v{font-size:20px;font-weight:700}
.wlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:8px;color:var(--muted)}
.wlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
@media (max-width:860px){.worthgrid{grid-template-columns:1fr}}
.relief{margin-bottom:20px;border-top:4px solid var(--limit)}
.relief .controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;margin-bottom:14px}
.relief .controls .f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.relief .controls input[type=number],.relief .controls select{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:110px}
.relief .flags{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.relief .flags label{display:flex;align-items:center;gap:6px;cursor:pointer}
.yearstrip{display:flex;gap:4px;margin:4px 0 18px;flex-wrap:wrap}
.yearstrip button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:6px 8px;min-width:58px;cursor:pointer;text-align:center;line-height:1.2}
.yearstrip button.on{background:color-mix(in srgb,var(--income) 18%,var(--panel));color:var(--ink);border-color:var(--income)}
.yearstrip button.sel{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink);font-weight:700}
.yearstrip small{display:block;font-size:11px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--panel)}
.rcard h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rcard p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.rcard .est{margin-top:8px;font-weight:700;font-size:15px;color:var(--ink)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;flex:none}
.b-yes{background:color-mix(in srgb,var(--income) 18%,transparent);color:var(--income)}
.b-maybe{background:color-mix(in srgb,var(--limit) 20%,transparent);color:var(--limit)}
.b-no{background:var(--track);color:var(--muted)}
.b-proj{background:color-mix(in srgb,var(--invest) 18%,transparent);color:var(--invest)}
.rcard.no{opacity:.75}
.relief h4{font-size:15px;margin:18px 0 8px}
.ai{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.ai .out{white-space:pre-wrap;font-size:15px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:10px;max-height:520px;overflow:auto}
.ai .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ai input[type=text]{flex:1 1 260px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
button.primary{font:inherit;font-size:15px;font-weight:700;background:var(--ink);color:var(--panel);border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
button.primary:disabled{opacity:.5;cursor:default}
.bank{margin-bottom:20px;border-top:4px solid var(--invest)}
.bankgrid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:24px;align-items:start}
.bank .chart svg{width:100%;height:auto;display:block}
.bankstats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:14px}
.bankstats .k{font-size:13px;color:var(--muted)}
.bankstats .v{font-size:20px;font-weight:700}
@media (max-width:860px){.bankgrid{grid-template-columns:1fr}}
.v,.big,.tot,.num-t,table,input[type=number],.est,svg text,.netrow .v,.legend span,.yearstrip button{font-variant-numeric:tabular-nums}
header.top .brand{font-weight:800;color:var(--ink);font-size:18px;letter-spacing:-0.01em}
.topctl{display:flex;align-items:center;gap:10px}
.seg.lang{margin-left:0}
.seg.lang button{font-weight:700;padding:5px 12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">Private Budget Dashboard</span>
    <div class="topctl">
      <span class="seg lang" role="group" data-i18n-aria="langAria" aria-label="Język"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></span>
      <button class="ghost" id="reset" type="button" data-i18n="reset">Przywróć domyślne</button>
    </div>
  </header>

  <section class="profile" data-i18n-aria="profileAria" aria-label="Twój profil">
    <label class="f"><span data-i18n="city">Miasto</span><select id="city"></select></label>
    <label class="f"><span data-i18n="flat">Mieszkanie</span><select id="flatType"><option value="k" data-i18n="flatK">Kawalerka (do 40 m²)</option><option value="m" data-i18n="flatM">Mieszkanie 40–59 m²</option></select></label>
    <label class="f"><span data-i18n="age">Wiek</span><input type="number" id="age" min="18" max="70" step="1"></label>
    <label class="f hidden" id="bmWrap"><span data-i18n="bm">Miesiąc urodzin</span><select id="bm"></select></label>
    <div class="cityinfo" id="cityInfo"></div>
  </section>

  <section class="hero" aria-live="polite">
    <div>
      <h1 id="heroTitle">…</h1>
      <p class="sub" id="heroSub"></p>
      <div class="netrow">
        <div><div class="k" id="n1Lbl"></div><div class="v" id="netBefore">–</div></div>
        <div><div class="k" id="n2Lbl"></div><div class="v" id="netAfter">–</div></div>
        <div><div class="k" id="leftLbl"></div><div class="v" id="limitLeft">–</div></div>
      </div>
    </div>
    <div class="chart" id="heroChart" role="img" data-i18n-aria="heroAria"></div>
  </section>

  <div class="grid2">
    <section class="panel cost">
      <h2><span data-i18n="costTitle"></span> <span class="tot" id="costTotal">–</span></h2>
      <p class="hint" data-i18n="costHint"></p>
      <div id="costSliders"></div>
    </section>

    <section class="panel inc">
      <h2><span data-i18n="incTitle"></span> <span class="tot" id="incTotal">–</span></h2>
      <p class="hint" data-i18n="incHint"></p>
      <div id="incSliders"></div>
      <div class="opts">
        <label><input type="checkbox" id="pit2"> <span data-i18n="pit2"></span></label>
        <label><span data-i18n="kupLbl"></span>
          <select id="kup"><option value="250" data-i18n="kup250"></option><option value="300" data-i18n="kup300"></option></select>
        </label>
        <label><input type="checkbox" id="reinvest"> <span data-i18n="reinvest"></span></label>
      </div>
    </section>
  </div>

  <div class="grid2">
    <section class="panel balance">
      <h2 data-i18n="balTitle"></h2>
      <p class="hint" data-i18n="balHint"></p>
      <div class="big" id="surplus">–</div>
      <div id="warn"></div>
      <div class="alloc" id="alloc" aria-hidden="true"></div>
      <div class="legend" id="legend"></div>
      <div class="kv" id="kv"></div>
    </section>

    <section class="panel proj">
      <h2 data-i18n="projTitle"></h2>
      <p class="hint" id="projHint"></p>
      <div class="projnums">
        <div><div class="k" data-i18n="pFinal"></div><div class="v" id="pFinal">–</div></div>
        <div><div class="k" data-i18n="pPaid"></div><div class="v" id="pPaid">–</div></div>
        <div><div class="k" data-i18n="pGain"></div><div class="v" id="pGain" style="color:var(--income)">–</div></div>
      </div>
      <div id="projChart" role="img" data-i18n-aria="projAria"></div>
    </section>
  </div>

  <section class="panel bank">
    <h2><span data-i18n="bankTitle"></span> <span class="tot" id="bankEnd">–</span></h2>
    <p class="hint" data-i18n="bankHint"></p>
    <div class="bankgrid">
      <div>
        <div id="bankSlider"></div>
        <div class="bankstats">
          <div><div class="k" data-i18n="bankDelta"></div><div class="v" id="bankDelta">–</div></div>
          <div><div class="k" data-i18n="bankMin"></div><div class="v" id="bankMin">–</div></div>
          <div><div class="k" data-i18n="bankAvg"></div><div class="v" id="bankAvg">–</div></div>
          <div id="bankAfterBox"><div class="k" data-i18n="bankAfter"></div><div class="v" id="bankAfter">–</div></div>
        </div>
      </div>
      <div class="chart" id="bankChart" role="img" data-i18n-aria="bankAria"></div>
    </div>
  </section>

  <section class="panel worth">
    <h2><span data-i18n="worthTitle"></span> <span class="tot" id="worthEnd">–</span></h2>
    <p class="hint" data-i18n="worthHint"></p>
    <div class="tablewrap"><table class="items" id="items"></table></div>
    <div class="addrow">
      <button class="ghost" type="button" data-add="inv" data-i18n="addInv"></button>
      <button class="ghost" type="button" data-add="asset" data-i18n="addAsset"></button>
      <button class="ghost" type="button" data-add="debt" data-i18n="addDebt"></button>
    </div>
    <div class="worthgrid">
      <div>
        <div class="chart" id="worthChart" role="img" data-i18n-aria="worthAria"></div>
        <div class="wlegend" id="worthLegend"></div>
      </div>
      <div class="worthstats">
        <div><div class="k" data-i18n="wAssets"></div><div class="v" id="wAssets">–</div></div>
        <div><div class="k" data-i18n="wDebts"></div><div class="v" id="wDebts" style="color:var(--cost)">–</div></div>
        <div><div class="k" data-i18n="wStart"></div><div class="v" id="wStart">–</div></div>
        <div><div class="k" data-i18n="wDelta"></div><div class="v" id="wDelta">–</div></div>
      </div>
    </div>
  </section>

  <section class="panel relief" id="reliefPanel">
    <h2><span data-i18n="reliefTitle"></span> <span class="tot" id="reliefCount">–</span></h2>
    <p class="hint" data-i18n="reliefHint"></p>
    <div class="controls">
      <label class="f"><span data-i18n="taxYear"></span><input type="number" id="taxYear" min="2019" max="2040" step="1"></label>

function reliefMonths(s){ if(s.age >= 26) return 0; if(s.age === 25) return Math.max(0, s.bm - 1); return 12; }

function calcYear(s){
  const b = s.brutto, kup = +s.kup, rel = reliefMonths(s);
  let cum=0, cumEx=0, cumBase=0, zusBaseCum=0, months=[], crossIdx=-1, crossFrac=null;
  for(let m=0;m<12;m++){
    const capBase = Math.min(b, Math.max(0, ZUS_CAP - zusBaseCum)); zusBaseCum += capBase;
    const zus = capBase*0.1126 + b*0.0245;
    const health = (b - zus)*0.09;
    let exempt = 0;
    if(m < rel){
      exempt = Math.min(b, Math.max(0, LIMIT - cumEx));
      if(exempt < b && crossIdx<0){ crossIdx = m; crossFrac = m + exempt/b; }
      cumEx += exempt;
    }
    const taxable = b - exempt;
    cum += b;
    let base=0, adv=0;
    if(taxable>0 && b>0){
      const zusShare = zus*taxable/b;
      base = Math.max(0, Math.round(taxable - zusShare - Math.min(kup, Math.max(0,taxable - zusShare))));
      const low = Math.max(0, Math.min(base, THRESH - cumBase)), high = base - low;
      adv = Math.max(0, Math.round(low*0.12 + high*0.32 - (s.pit2?300:0)));
      cumBase += base;
    }
    months.push({b, zus, health, adv, net:b-zus-health-adv, cum, taxable, exempt});
  }
  const annualTax = cumBase<=THRESH ? Math.max(0, cumBase*0.12 - 3600) : 10800 + (cumBase-THRESH)*0.32;
  const advSum = months.reduce((a,x)=>a+x.adv,0);
  return {months, rel, crossIdx, crossFrac, cum, cumEx, cumBase, annualTax, advSum, refund: advSum - annualTax};
}
function solveBrutto(netTarget, s){
  let lo=0, hi=80000;
  for(let i=0;i<60;i++){ const mid=(lo+hi)/2; const n = calcYear(Object.assign({}, s, {brutto:mid})).months[0].net; if(n < netTarget) lo = mid; else hi = mid; }
  return Math.round((lo+hi)/2);
}
const firstNet = s => calcYear(s).months[0].net;

const ACOL = ["--a1","--a2","--a3","--a4","--a5","--a6"], DCOL = ["--d1","--d2","--d3"];
function itemColor(it){
  const list = state.items.filter(x=>x.kind==="debt"?it.kind==="debt":x.kind!=="debt"&&it.kind!=="debt");
  const i = list.indexOf(it); return it.kind==="debt" ? DCOL[i%DCOL.length] : ACOL[i%ACOL.length];
}
function nextId(){ return state.items.reduce((a,x)=>Math.max(a,x.id),0)+1; }
function recalcTotals(){
  state.invest = state.items.filter(x=>x.kind==="inv").reduce((a,x)=>a+(+x.contrib||0),0);
  state.loan   = state.items.filter(x=>x.kind==="debt").reduce((a,x)=>a+(+x.contrib||0),0);
}
function setTotal(kind, v){
  let rows = state.items.filter(x=>x.kind===kind);
  if(!rows.length){
    if(v<=0){ recalcTotals(); return; }
    const n = kind==="inv" ? {kind, name:t("n_inv",1), value:0, contrib:0, rate:state.rate} : {kind, name:t("nLoan"), value:0, contrib:0, rate:8};
    n.id = nextId(); state.items.push(n); rows=[n];
  }
  const sum = rows.reduce((a,x)=>a+(+x.contrib||0),0);
  if(sum>0){ let acc=0; rows.forEach((x,i)=>{ x.contrib = i<rows.length-1 ? Math.round(x.contrib*v/sum) : 0; acc+=x.contrib; }); rows[rows.length-1].contrib = Math.max(0, v-acc); }
  else { rows.forEach((x,i)=>x.contrib = i===0 ? v : 0); }
  recalcTotals(); renderItems();
}
function simItems(s, extra, months){
  const inv = s.items.filter(x=>x.kind==="inv");
  const csum = inv.reduce((a,x)=>a+(+x.contrib||0),0);
  const out = s.items.map(it=>({it, vals:[+it.value||0], paid:[]}));
  for(let m=0;m<months;m++){
    out.forEach(o=>{
      const it=o.it, v=o.vals[o.vals.length-1], r=(+it.rate||0)/100;
      if(it.kind==="inv"){
        const share = csum>0 ? (+it.contrib||0)/csum : 1/inv.length;
        o.vals.push(v*Math.pow(1+r,1/12) + (+it.contrib||0) + extra*share);
      } else if(it.kind==="asset"){
        o.vals.push(v*Math.pow(1+r,1/12));
      } else {
        const start = +it.value||0, pay = +it.contrib||0;
        if(start<=0){ o.vals.push(0); o.paid.push(pay); }
        else { const owed = v*(1+r/12); const p = Math.min(pay, owed); o.vals.push(owed-p); o.paid.push(p); }
      }
    });
  }
  return out;
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function renderItems(){
  const tb = document.getElementById("items"); if(!tb) return;
  let h = `<tr><th>${t("thKind")}</th><th>${t("thName")}</th><th>${t("thValue")}</th><th>${t("thContrib")}</th><th>${t("thRate")}</th><th></th></tr>`;
  ["inv","asset","debt"].forEach(k=>{
    const rows = state.items.filter(x=>x.kind===k);
    if(!rows.length) return;
    h += `<tr class="group"><td colspan="6">${t("grp_"+k)}</td></tr>`;
    rows.forEach(it=>{
      const rt = t("rate_"+k);
      h += `<tr data-id="${it.id}">
        <td class="kind"><i style="background:var(${itemColor(it)})"></i>${t("k_"+k)}</td>
        <td><input type="text" data-f="name" value="${esc(it.name)}" aria-label="${t("thName")}"></td>
        <td><input type="number" data-f="value" step="100" min="0" value="${it.value}" aria-label="${k==="debt"?t("ariaDebtVal"):t("thValue")}"></td>
        <td>${k==="asset"?`<span class="na">—</span>`:`<input type="number" data-f="contrib" step="50" min="0" value="${it.contrib}" aria-label="${k==="debt"?t("ariaPay"):t("ariaContrib")}">`}</td>
        <td><input type="number" data-f="rate" step="0.5" value="${it.rate}" title="${rt}" aria-label="${rt}"></td>
        <td><button class="x" type="button" data-del="${it.id}" aria-label="${t("del")} ${esc(it.name)}">×</button></td></tr>`;
    });
  });
  if(!state.items.length) h += `<tr><td colspan="6" style="color:var(--muted)">${t("itemsEmpty")}</td></tr>`;
  tb.innerHTML = h;
}

function taxOf(x, yr){
  x = Math.max(0, x);
  if(yr >= 2022) return x<=120000 ? Math.max(0, x*0.12-3600) : 10800 + (x-120000)*0.32;
  const r = yr===2019 ? 0.1775 : 0.17;
  const red = x<=8000 ? 1360 : x<=13000 ? 1360-834.88*(x-8000)/5000 : x<=85528 ? 525.12 : x<=127000 ? Math.max(0,525.12-525.12*(x-85528)/41472) : 0;
  return x<=85528 ? Math.max(0, x*r - red) : 85528*r - red + (x-85528)*0.32;
}
function reliefs(s){
  const yr = s.taxYear, age = s.age + (yr - BASE_YEAR), fut = yr > 2026, young = age < 26;
  const y = calcYear(Object.assign({}, s, {age})), y30 = calcYear(Object.assign({}, s, {age:30}));
  const base = y.cumBase, tYr = Math.min(yr, 2026);
  const save = d => tYr>=2022 ? taxOf(base, tYr) - taxOf(base - Math.min(d, base), tYr) : Math.min(d,base)*(base>85528?0.32:0.17);
  const L = [], add = (id, st, text, est) => L.push({id, st, name:t("rn_"+id), text, est:est||""});

  if(young && yr >= 2019){
    const sv = Math.max(0, y30.annualTax - y.annualTax);
    add("pit0", "yes", t("rt_pit0", yr===2019 ? t("pit0Lim2019") : fmt(LIMIT), age===25), sv>0 ? t("re_pit0", fmt(sv)) : t("re_pit0All"));
  }
  const ikzeLim = s.fJdg && yr>=2021 ? known(IKZE_JDG, yr) : known(IKZE, yr), ikzeSave = save(ikzeLim);
  add("ikze", ikzeSave>50 ? "yes" : "maybe", t("rt_ikze", fmt(ikzeLim), s.fJdg, fut), ikzeSave>50 ? t("re_ikze", fmt(ikzeSave)) : (young ? t("re_ikzeLow0") : t("re_ikzeLow")));
  add("ike", "yes", t("rt_ike", fmt(known(IKE, yr)), fut, young));
  const annualB = s.brutto*12;
  if(yr===2022) add("mid", (annualB>=68412 && annualB<=133692 && !young) ? "yes" : "no", t("rt_mid22"));
  else add("mid", "no", t("rt_mid"));
  add("kup", s.kup==="300" ? "yes" : "maybe", t("rt_kup"), base>0 ? t("re_kup", fmt(save(600))) : "");
  add("aut", s.fCreative ? "yes" : "no", t("rt_aut", fmt(yr>=2022?120000:85528)), s.fCreative && base>0 ? (young ? t("re_aut0") : t("re_aut")) : "");
  add("net", base>0 ? "yes" : "maybe", t("rt_net"), base>0 ? t("re_net", fmt(save(760))) : t("re_net0"));
  add("don", "maybe", t("rt_don"));
  add("kids", s.kids>0 ? "yes" : "no", t("rt_kids"), s.kids>0 ? t("re_kids", fmt([0,1112.04,2224.08,4224.12,6924.12][Math.min(4,s.kids)])) : "");
  add("k4", yr>=2022 && s.kids>=4 ? "yes" : "no", t("rt_k4"));
  add("mar", s.fMarried ? "maybe" : "no", t("rt_mar"));
  add("ret", yr>=2022 && s.fReturn ? "yes" : "no", t("rt_ret"));
  add("sen", yr>=2022 && age>=60 ? "maybe" : "no", t("rt_sen"));
  add("th", s.fHouse ? "yes" : "no", t("rt_th"));
  if(s.fJdg && young) add("jdg", "maybe", t("rt_jdg"));
  add("22", "proj", t("rt_22"));
  return {list:L, age, y, base};
}

function buildSlider(c, host){
  const w = document.createElement("div"); w.className="sl";

  host.appendChild(w);

    } catch(e){

  const line = pts.map(p=>`${x(p[0]).toFixed(1)},${yy(p[1]).toFixed(1)}`).join(" ");
  const area = `${x(0)},${yy(0)} ${line} ${x(12)},${yy(0)}`;
  let g = "";
  for(let k=0;k<=4;k++){ const v = maxY/1.12*k/4; g += `<line x1="${pl}" x2="${W-pr}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${yy(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${axis(v)}</text>`; }

  } else {

    svg += `<polygon points="${x(0)},${yy(0)} ${nline} ${x(12)},${yy(0)}" fill="var(--income)" opacity=".22"/>

  g+=`<circle cx="${x(11)+bw/2}" cy="${yy(bal[11])}" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function worthChart(bank, sims, worth){
  const W=680,H=280,pl=64,pr=12,pt=14,pb=30, N=13;
  const pos = k => Math.max(0,bank[k]) + sims.filter(o=>o.it.kind!=="debt").reduce((a,o)=>a+Math.max(0,o.vals[k]),0);
  const neg = k => Math.max(0,-bank[k]) + sims.filter(o=>o.it.kind==="debt").reduce((a,o)=>a+o.vals[k],0);
  let mx=0, mn=0; for(let k=0;k<N;k++){ mx=Math.max(mx,pos(k),worth[k]); mn=Math.min(mn,-neg(k),worth[k]); }
  const pad=(mx-mn)*0.08||1000; mx+=pad; if(mn<0) mn-=pad;
  const x=k=>pl+(W-pl-pr)*(k+0.5)/N, yy=v=>pt+(H-pt-pb)*(mx-v)/(mx-mn), bw=(W-pl-pr)/N*0.6;
  let g="";
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${yy(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${axis(v)}</text>`; }
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy(0)}" y2="${yy(0)}" stroke="var(--muted)"/>`;
  for(let k=0;k<N;k++){
    let up=0, dn=0;
    const seg=(val,col,title,isNeg)=>{ if(val<=0) return; const a=isNeg?-dn:up, b=isNeg?-(dn+val):up+val;
      g+=`<rect x="${x(k)-bw/2}" y="${yy(Math.max(a,b))}" width="${bw}" height="${Math.max(0.5,Math.abs(yy(a)-yy(b)))}" fill="var(${col})" opacity=".85"><title>${esc(title)}: ${fmt(val)}</title></rect>`;
      if(isNeg) dn+=val; else up+=val; };
    seg(Math.max(0,bank[k]),"--bankc",t("bankLbl"),false); seg(Math.max(0,-bank[k]),"--d1",t("overdraft"),true);
    sims.forEach(o=>{ const v=o.vals[k]; if(o.it.kind==="debt") seg(v,itemColor(o.it),o.it.name,true); else seg(Math.max(0,v),itemColor(o.it),o.it.name,false); });
    g+=`<text x="${x(k)}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)">${k===0?t("start"):M()[k-1]}</text>`;
  }
  g+=`<polyline points="${worth.map((v,k)=>`${x(k)},${yy(v)}`).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`;
  worth.forEach((v,k)=>{ if(k===0||k===12) g+=`<circle cx="${x(k)}" cy="${yy(v)}" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
const signed = v => (v>=0?"+":"−") + fmt(Math.abs(v));

// ---------- główne przeliczenie ----------
function update(){
  const s = state, y = calcYear(s);
  const costSum = COSTS.reduce((a,c)=>a+s[c.id],0);
  const yearNet = y.months.reduce((a,m)=>a+m.net,0), avgNet = yearNet/12;
  const income = avgNet + s.other, surplus = income - costSum;
  const firstTaxed = y.months.findIndex(m=>m.taxable>0);
  const hasRelief = y.rel > 0, changes = firstTaxed > 0;
  const zusY = y.months.reduce((a,m)=>a+m.zus,0), healthY = y.months.reduce((a,m)=>a+m.health,0);

  const tt = document.getElementById("heroTitle"), sub = document.getElementById("heroSub");
  const taxLine = t("taxLine", fmt(y.advSum), fmt(y.annualTax), y.refund>50 ? fmt(y.refund) : "");
  const n1 = document.getElementById("n1Lbl"), n2 = document.getElementById("n2Lbl"), lbl = document.getElementById("leftLbl");
  const v1 = document.getElementById("netBefore"), v2 = document.getElementById("netAfter"), v3 = document.getElementById("limitLeft");
  if(!hasRelief && s.age >= 26){
    tt.textContent = t("heroFullT", fmt(yearNet));
    sub.innerHTML = t("heroFullS", fmt(y.cum), fmt(zusY), fmt(healthY), fmt(y.annualTax), fmt(avgNet)) + (y.refund>50 ? t("refundLine", fmt(y.refund)) : "");
    n1.textContent = t("nAvg"); v1.textContent = fmt(avgNet);
    n2.textContent = t("nYearNet"); v2.textContent = fmt(yearNet);
    lbl.textContent = t("nTax"); v3.textContent = fmt(y.annualTax);
  } else {
    if(!hasRelief){ tt.textContent = t("heroEndsJanT"); sub.innerHTML = t("heroEndsJanS", taxLine); }
    else if(y.crossIdx >= 0){ tt.textContent = t("heroCrossT", y.crossIdx); sub.innerHTML = t("heroCrossS", y.crossIdx+1, fmt(y.cum - LIMIT), taxLine); }
    else if(y.rel < 12){ tt.textContent = t("heroBdayT", y.rel); sub.innerHTML = t("heroBdayS", fmt(LIMIT - y.cumEx), taxLine); }
    else { tt.textContent = t("heroWithinT"); sub.innerHTML = t("heroWithinS", fmt(y.cum)); }
    n1.textContent = t("nBefore"); v1.textContent = hasRelief ? fmt(y.months[0].net) : "—";
    n2.textContent = t("nAfter"); v2.textContent = firstTaxed<0 ? "—" : fmt(y.months[11].net);
    lbl.textContent = t("nLeft"); v3.textContent = s.age===25 ? t("leftUntil", s.bm-1) : t("leftYears", 26 - s.age);
  }
  document.getElementById("heroChart").innerHTML = heroChart(y);

  document.getElementById("costTotal").textContent = fmt(costSum);
  document.getElementById("incTotal").textContent = fmt(income) + t("netSuffix");

  const sEl = document.getElementById("surplus");
  sEl.textContent = signed(surplus); sEl.className = "big " + (surplus>=0?"pos":"neg");
  const before = y.months[0].net + s.other - costSum, after = y.months[11].net + s.other - costSum;
  document.getElementById("warn").innerHTML =
    surplus<0 ? `<div class="warn">${t("warnDeficit", fmt(-surplus))}</div>` :
    (changes && after<0) ? `<div class="warn">${t("warnAfter", fmt(-after))}</div>` : "";
  const base = Math.max(income, costSum);
  let bar="", leg="";
  COSTS.forEach(c=>{ const v=s[c.id], nm=t("sl_"+c.id);
    bar+=`<span style="width:${base>0?v/base*100:0}%;background:var(${c.color})" title="${nm}: ${fmt(v)}"></span>`;
    leg+=`<div><span><i style="background:var(${c.color})"></i>${nm}</span><span>${fmt(v)} <span class="pct">${income>0?Math.round(v/income*100):0}%</span></span></div>`; });
  if(surplus>0){ bar+=`<span style="width:${surplus/base*100}%;background:var(--c-free)" title="${t("free")}: ${fmt(surplus)}"></span>`;
    leg+=`<div><span><i style="background:var(--c-free)"></i>${t("free")}</span><span>${fmt(surplus)} <span class="pct">${Math.round(surplus/income*100)}%</span></span></div>`; }
  document.getElementById("alloc").innerHTML = bar;
  document.getElementById("legend").innerHTML = leg;
  const saveRate = income>0 ? (s.invest + Math.max(0,surplus))/income*100 : 0;
  document.getElementById("kv").innerHTML = `
    <span class="k">${t("kvAvg")}</span><span class="v">${fmt(avgNet)}</span>
    ${changes ? `<span class="k">${t("kvBefore")}</span><span class="v">${fmt(before)}</span><span class="k">${t("kvAfter")}</span><span class="v">${fmt(after)}</span>`
              : `<span class="k">${t("kvMonthly")}</span><span class="v">${fmt(surplus)}</span>`}
    <span class="k">${t("kvRate")}</span><span class="v">${saveRate.toFixed(0)}%</span>
    <span class="k">${t("kvYear")}</span><span class="v">${fmt(surplus*12)}</span>`;

  const extraInv = s.reinvest ? Math.max(0,surplus) : 0;
  const invItems = s.items.filter(x=>x.kind==="inv");
  const contrib = s.invest + (invItems.length ? extraInv : 0);
  const startInv = invItems.reduce((a,x)=>a+(+x.value||0),0);
  const simP = simItems(Object.assign({}, s, {items:invItems}), extraInv, s.years*12);
  let series=[startInv], paidS=[startInv], paid=startInv;
  for(let yr=1; yr<=s.years; yr++){ paid += contrib*12; paidS.push(paid); series.push(simP.reduce((a,o)=>a+o.vals[yr*12],0)); }
  const v = series[series.length-1];
  const wDen = invItems.reduce((a,x)=>a+(+x.value||0)+(+x.contrib||0)*12,0);
  const wRate = wDen>0 ? invItems.reduce((a,x)=>a+(+x.rate||0)*((+x.value||0)+(+x.contrib||0)*12),0)/wDen : s.rate;
  document.getElementById("pFinal").textContent = fmtK(v);
  document.getElementById("pPaid").textContent = fmtK(paid);
  document.getElementById("pGain").textContent = fmtK(v - paid);
  document.getElementById("projHint").textContent = invItems.length ? t("projHint", invItems.length, fmt(startInv), fmt(contrib), s.years, dec1(wRate)) : t("projEmpty");
  document.getElementById("projChart").innerHTML = projChart(series, paidS);

  const outExtra = invItems.length ? extraInv : 0;
  const sim12 = simItems(s, outExtra, 12);
  const debtPaid = m => sim12.filter(o=>o.it.kind==="debt").reduce((a,o)=>a+o.paid[m],0);
  let b0 = s.bank, bal=[], flows=[];
  y.months.forEach((m,i)=>{ const f = m.net + s.other - costSum - outExtra + (s.loan - debtPaid(i)); flows.push(f); b0 += f; bal.push(b0); });
  const bEnd=bal[11], bMin=Math.min(s.bank,...bal), d=bEnd-s.bank;
  document.getElementById("bankEnd").textContent = fmt(bEnd);
  const dEl=document.getElementById("bankDelta"); dEl.textContent=signed(d); dEl.style.color=d>=0?"var(--income)":"var(--cost)";
  const mEl=document.getElementById("bankMin"); mEl.textContent=fmt(bMin); mEl.style.color=bMin<0?"var(--cost)":"";
  document.getElementById("bankAvg").textContent=signed(d/12);
  document.getElementById("bankAfterBox").classList.toggle("hidden", !changes);
  document.getElementById("bankAfter").textContent = changes ? signed(flows[11]) : "—";
  document.getElementById("bankChart").innerHTML = bankChart(s.bank, bal, flows);

  const bankSeries=[s.bank,...bal];
  const totA = k => Math.max(0,bankSeries[k]) + sim12.filter(o=>o.it.kind!=="debt").reduce((a,o)=>a+o.vals[k],0);
  const totD = k => Math.max(0,-bankSeries[k]) + sim12.filter(o=>o.it.kind==="debt").reduce((a,o)=>a+o.vals[k],0);
  const worth = [...Array(13)].map((_,k)=>totA(k)-totD(k));
  document.getElementById("worthEnd").textContent = fmt(worth[12]);
  document.getElementById("wAssets").textContent = fmt(totA(12));
  document.getElementById("wDebts").textContent = fmt(totD(12));
  document.getElementById("wStart").textContent = fmt(worth[0]);
  const wd = worth[12]-worth[0], wdEl=document.getElementById("wDelta");
  wdEl.textContent = signed(wd); wdEl.style.color = wd>=0?"var(--income)":"var(--cost)";
  document.getElementById("worthChart").innerHTML = worthChart(bankSeries, sim12, worth);
  document.getElementById("worthLegend").innerHTML =
    `<span><i style="background:var(--bankc)"></i>${t("legendBank")}</span>` +
    sim12.map(o=>`<span><i style="background:var(${itemColor(o.it)})"></i>${esc(o.it.name)}</span>`).join("") +
    `<span><i style="background:var(--ink);height:3px;vertical-align:middle"></i>${t("legendWorth")}</span>`;

  renderReliefs();

  let rows = `<tr><th>${t("thMonth")}</th><th>${t("thGross")}</th><th>${t("thZus")}</th><th>${t("thHealth")}</th><th>${t("thAdv")}</th><th>${t("thNet")}</th><th>${t("thCum")}</th><th>${t("thBank")}</th></tr>`;
  y.months.forEach((m,i)=>{ rows += `<tr class="${i===firstTaxed && changes?"cross":""}"><td>${M()[i]}</td><td>${fmt(m.b)}</td><td>${fmt(m.zus)}</td><td>${fmt(m.health)}</td><td>${fmt(m.adv)}</td><td><strong>${fmt(m.net)}</strong></td><td>${fmt(m.cum)}</td><td>${fmt(bal[i])}</td></tr>`; });
  document.getElementById("table").innerHTML = rows;
}

applyStatic(); renderItems(); syncRelief(); syncAll(); update();
})();
</script>
